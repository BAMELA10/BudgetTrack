services:
  postgres:
    ports: !reset []
  mailpit:
    deploy:
      replicas: 0
  server:
    build:
      target: prod
    ports: !reset []
    volumes: !reset []
  client:
    build:
      target: prod
    ports: !reset []
    volumes: !reset []
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - server
      - client
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
  